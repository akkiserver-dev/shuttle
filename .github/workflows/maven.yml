# Builds the Maven reactor (shuttle-java, the example and the WIT tooling)
# and runs its tests.
#
# - linux:   native libraries for Linux x86_64 and aarch64 via `cross`; all modules.
# - windows: native library built on the host (MSVC); shuttle-java and the example
#            only, because shuttle-wit-parser has no Windows native library yet.
#
# setup-rust-toolchain sets RUSTFLAGS=-D warnings, so Rust warnings fail the build.

name: Java CI with Maven

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown # for the valuetest fixture
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Install cargo cross
        run: cargo install cross
      - name: Build with Maven
        run: mvn -P build-linux-x86-64,build-linux-aarch64 -Dcargo.profile=release -Dcargo.profile.folder=release -B package --file pom.xml

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown # for the valuetest fixture
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn -P build-host-windows-x86_64 -pl shuttle-java,shuttle-java-example -am -Dcargo.profile=release -Dcargo.profile.folder=release -B package --file pom.xml
