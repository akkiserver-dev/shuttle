[package]
name = "wasmtime-binding"
version = "4.0.3"
edition = "2024"

[profile.release]
opt-level = 's'     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Allow LLVM to optimize more aggressively across the whole crate
panic = 'abort'     # Removes stack unwinding code (saves a lot of space)

[lib]
name = "wasmtimebinding"
crate-type = ["cdylib"]

[dependencies]
wasmtime = { version = "46" }
jni = { version = "0.22" }
log = { version = "0.4", features = ["std"] }
wat = "1.253"
weave-wasmtime = { git = "https://github.com/akkiserver-dev/weave", rev = "0f26893477886c12dd881623c5813b3afcc844d2" }
weave-core = { git = "https://github.com/akkiserver-dev/weave", rev = "0f26893477886c12dd881623c5813b3afcc844d2" }
weave-host = { git = "https://github.com/akkiserver-dev/weave", rev = "0f26893477886c12dd881623c5813b3afcc844d2" }
weave-transform = { git = "https://github.com/akkiserver-dev/weave", rev = "0f26893477886c12dd881623c5813b3afcc844d2" }

[dev-dependencies]
# Invocation feature is necessary for tests to spin up a VM
jni = { version = "0.22", features = ["invocation"] }